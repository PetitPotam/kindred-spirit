# Weekly, grouped update pull requests. Minecraft and Fabric versions are never bumped automatically: moving
# to a new Minecraft version is a deliberate change (docs/MAINTAINING.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
  - package-ecosystem: pip
    directory: /brain
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
    groups:
      python: {patterns: ["*"]}
  - package-ecosystem: gradle
    directory: /mod
    schedule: {interval: monthly}
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "com.mojang:*"
      - dependency-name: "net.fabricmc*"
      - dependency-name: "fabric-loom"
  - package-ecosystem: docker # her Docker image's base (docker/Dockerfile, #128): pinned by digest, kept current here
    directory: /docker
    schedule: {interval: monthly}
    open-pull-requests-limit: 1
