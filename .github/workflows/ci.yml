name: CI
# Every pull request and every push to main: build and test the mod and the brain. "CI passed" is the one
# check a pull request needs before it can be merged (see docs/MAINTAINING.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency: # a new push to the same pull request cancels the run still going for the old one
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mod:
    name: Mod (build and Java tests, every Minecraft version)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      # Gradle and Loom run on Java 25; each jar is compiled for its Minecraft's Java (21 for 1.21.x, 25 for 26.x)
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # one jar per Minecraft version in mod/versions/, each with all the Java tests (Stonecutter, see CONTRIBUTING.md)
      - run: ./gradlew build --no-daemon --continue
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-reports
          path: mod/versions/*/build/reports/tests/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kindred-spirit-jars
          path: mod/build/libs/*.jar

  brain:
    name: Brain (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: brain/requirements*.txt
      - run: pip install -r brain/requirements-dev.txt
      - name: Lint (Ruff, ruff.toml)
        run: ruff check brain services scripts setup demo
      - run: python -m pytest -q brain/tests

  windows-script:
    name: Windows update script (parses)
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\update-pip-windows.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }

  conventions:
    name: Pull request conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Branch name, title and linked issue (CONTRIBUTING.md)
        env: # (values from the pull request go through the environment, never into the script itself)
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          fail=0
          if [ "${#TITLE}" -gt 72 ]; then
            echo "::error title=Pull request title::${#TITLE} characters: at most 72 (it becomes the commit title on main)."
            fail=1
          fi
          if printf '%s' "$TITLE" | grep -Eqi '^(feat|fix|chore|docs|ci|refactor|build|test|perf|style)(\(.*\))?!?:'; then
            echo "::warning title=Pull request title::No 'feat:'-style prefix: say what changes for the player, in plain English."
          fi
          case "$AUTHOR" in dependabot*|github-actions*) exit $fail ;; esac
          if ! printf '%s' "$BRANCH" | grep -Eq '^(feature|fix|docs|ci|refactor|chore)/[0-9]+-[a-z0-9-]+$|^release/[0-9]+[.][0-9]+[.][0-9]+|^batch/[0-9]{4}-[0-9]{2}-[0-9]{2}(-[a-z0-9-]+)?$'; then
            echo "::warning title=Branch name::Not type/issue-short-name (for example feature/93-setup-app) or batch/date-name: see CONTRIBUTING.md."
          fi
          case "$BRANCH" in
            release/*) ;;
            *) printf '%s' "$BODY" | grep -Eqi '(fix(es|ed)?|close[sd]?|resolve[sd]?|refs?) +([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+' \
                 || echo "::warning title=Linked issue::No 'Fixes #<number>' (or 'Refs #<number>') in the description: link the issue it's for." ;;
          esac
          exit $fail

  passed:
    name: CI passed
    if: always()
    needs: [mod, brain, windows-script, conventions]
    runs-on: ubuntu-24.04
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: echo "A job failed or was cancelled" && exit 1
      - run: echo "All good"
