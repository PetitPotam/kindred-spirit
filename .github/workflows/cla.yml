name: CLA
# Every contributor signs the Contributor License Agreement (CLA.md) once, by commenting on their pull request.
# Signatures are kept on the cla-signatures branch. The maintainer and bots don't need to sign.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {} # the job below asks for what the CLA assistant needs

jobs:
  cla:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write # the signatures live on the cla-signatures branch
      pull-requests: write
      statuses: write
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && (github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # (pull_request_target: this job never checks out or runs the pull request's code)
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/PetitPotam/kindred-spirit/blob/main/CLA.md
          branch: cla-signatures
          allowlist: PetitPotam,dependabot[bot],github-actions[bot],renovate[bot]
