name: Label pull requests
# Labels each pull request by the parts it touches (mod, brain, services, docs...), for review and release notes.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-24.04
    steps:
      # (pull_request_target: reads only the list of changed files, never runs the pull request's code)
      - uses: actions/labeler@v5
