name: Release
# Pushing a version tag (v0.2.0, v0.2.0-beta.1) builds the mod for every Minecraft version in mod/versions/ and makes
# a GitHub release with the jars and that version's notes from CHANGELOG.md, then puts each jar on Modrinth and
# CurseForge for its own Minecraft version. scripts/release.sh makes the tag; see docs/MAINTAINING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read # each job asks only for what it needs

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release
      id-token: write # sign the build provenance
      attestations: write
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
      version-type: ${{ steps.type.outputs.type }}
      minecraft: ${{ steps.minecraft.outputs.list }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: The tag is on main (a release comes from a merged release pull request)
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "Tag ${GITHUB_REF_NAME} isn't on main: releases come from a merged pull request (scripts/release.sh)."; exit 1; }
      - name: The tag matches the version in mod/gradle.properties
        id: version
        run: |
          v=$(sed -n 's/^mod_version=//p' mod/gradle.properties)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} but mod_version=$v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - run: ./gradlew build --no-daemon
        working-directory: mod
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $VERSION"; exit 1; }
      - name: Version type for Modrinth and CurseForge
        id: type
        run: |
          case "$VERSION" in *alpha*|*preview*) t=alpha;; *beta*|*rc*) t=beta;; *) t=release;; esac
          echo "type=$t" >> "$GITHUB_OUTPUT"
      - name: The Minecraft versions, and what Modrinth and CurseForge list for each (mod/versions/*/gradle.properties)
        id: minecraft
        run: |
          # versions.json, attached to the release: which jar goes with which Minecraft, its Fabric API and Java
          # (Kindred Spirit Setup reads it to install the right jar)
          list=""; json=""
          for p in mod/versions/*/gradle.properties; do
            mc=$(sed -n 's/^minecraft_version=//p' "$p"); java=$(sed -n 's/^java_version=//p' "$p")
            games=$(sed -n 's/^game_versions=//p' "$p"); fapi=$(sed -n 's/^fabric_version=//p' "$p")
            jar="kindred-spirit-$VERSION+$mc.jar"
            [ -f "mod/build/libs/$jar" ] || { echo "missing mod/build/libs/$jar"; exit 1; }
            list="$list{\"minecraft\":\"$mc\",\"java\":\"$java\",\"games\":\"$games\"},"
            json="$json  {\"minecraft\": \"$mc\", \"jar\": \"$jar\", \"fabric_api\": \"$fapi\", \"java\": $java},\n"
          done
          echo "list=[${list%,}]" >> "$GITHUB_OUTPUT"
          printf '{"mod_version": "%s", "versions": [\n%b]}\n' "$VERSION" "${json%,\\n}" > versions.json
          python3 -m json.tool versions.json
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$VERSION" in *-*) pre="--prerelease";; esac
          jars=$(ls mod/build/libs/*.jar | grep -v -- -sources)
          gh release create "$GITHUB_REF_NAME" $jars versions.json --title "Kindred Spirit $VERSION" --notes-file notes.md $pre --verify-tag
      - name: Sign where the jars came from (build provenance; check with `gh attestation verify <file> -R PetitPotam/kindred-spirit`)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            mod/build/libs/kindred-spirit-*+*.jar
            versions.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: |
            mod/build/libs/*.jar
            notes.md

      # (one flat folder: with several paths, upload-artifact keeps them below their common folder, and the Setup's
      #  build would find mod/build/libs/... instead of the jars it looks for, #155)
      - name: The mod files and versions.json in one folder, for Kindred Spirit Setup (the setup jobs below)
        run: |
          mkdir -p mod-files
          for jar in mod/build/libs/kindred-spirit-*+*.jar; do
            case "$jar" in *-sources.jar) ;; *) cp "$jar" mod-files/;; esac
          done
          cp versions.json mod-files/
          ls -l mod-files
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mod-files
          path: mod-files/
          if-no-files-found: error

  # Each jar on Modrinth and CurseForge, tagged with its own Minecraft version.
  publish:
    needs: release
    permissions:
      contents: read
    if: vars.MODRINTH_PROJECT_ID != '' || vars.CURSEFORGE_PROJECT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release.outputs.minecraft) }}
    env:
      VERSION: ${{ needs.release.outputs.version }}
      VERSION_TYPE: ${{ needs.release.outputs.version-type }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
      # Modrinth: only once the project exists and its ID and a token are set (Settings -> Secrets and variables ->
      # Actions: the variable MODRINTH_PROJECT_ID and the secret MODRINTH_TOKEN). A draft or private project stays
      # visible only to its members; see docs/MAINTAINING.md.
      - name: Publish on Modrinth
        if: vars.MODRINTH_PROJECT_ID != ''
        uses: Kir-Antipov/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: |
            mod/build/libs/kindred-spirit-${{ env.VERSION }}+${{ matrix.minecraft }}.jar
          name: Kindred Spirit ${{ env.VERSION }} for Minecraft ${{ matrix.minecraft }}
          version: ${{ env.VERSION }}+${{ matrix.minecraft }}
          version-type: ${{ env.VERSION_TYPE }}
          changelog-file: notes.md
          loaders: fabric
          game-versions: ${{ matrix.games }}
          dependencies: fabric-api(required){modrinth:P7dR8mSH}
      # CurseForge: the same jars and notes as the GitHub release, once the project exists and its numeric ID and an
      # API token are set (the variable CURSEFORGE_PROJECT_ID and the secret CURSEFORGE_TOKEN). mc-publish turns the
      # Minecraft and Java versions into CurseForge's numeric IDs. Each file is reviewed by CurseForge's moderators
      # before players see it; see docs/MAINTAINING.md and docs/curseforge.md.
      - name: Publish on CurseForge
        if: vars.CURSEFORGE_PROJECT_ID != ''
        uses: Kir-Antipov/mc-publish@c23376546a97f5ba7984e94445da359459b14419 # v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: |
            mod/build/libs/kindred-spirit-${{ env.VERSION }}+${{ matrix.minecraft }}.jar
          name: Kindred Spirit ${{ env.VERSION }} for Minecraft ${{ matrix.minecraft }}
          version: ${{ env.VERSION }}+${{ matrix.minecraft }}
          version-type: ${{ env.VERSION_TYPE }}
          changelog-file: notes.md
          loaders: fabric
          game-versions: ${{ matrix.games }}
          environment: client
          java: ${{ matrix.java }}
          dependencies: fabric-api(required){curseforge:306612}

  # Kindred Spirit Setup: the download that installs everything (docs/SETUP.md, setup/README.md). Built on each system
  # from the release's own mod files, smoke-tested (installed and started in a throwaway home), and attached to the
  # GitHub release with its SHA-256. Windows (#40) and Linux (#81) get their own rows here once their package exists.
  setup:
    name: Setup, ${{ matrix.name }}
    needs: release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # attach the Setup to the release
      id-token: write # sign the build provenance
      attestations: write
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, name: macOS Apple silicon, arch: arm64 }
          - { runner: macos-15-intel, name: macOS Intel, arch: x86_64 }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mod-files
          path: mod-files
      - name: Build it (with its own Python, whisper-server and the mod for each Minecraft version)
        run: python setup/build.py --arch ${{ matrix.arch }} --mods mod-files --out dist
      - name: Install and start it, as a player would (throwaway home, other ports)
        run: python setup/smoke_test.py dist/*.dmg
      - name: Sign where the Setup came from (build provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.dmg
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/*.dmg.sha256 --clobber

  setup-notes:
    name: Setup notes on the release
    needs: setup
    if: always() && needs.setup.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # edit the release notes
    timeout-minutes: 5
    steps:
      - name: Say which Setup files are there, what was tested, and what isn't there yet
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          assets=$(gh release view "$GITHUB_REF_NAME" -R "$REPO" --json assets -q '.assets[].name')
          line() { # file, chip, what was tested
            if grep -qx "$1" <<<"$assets"; then echo "- **$2:** \`$1\` ($3)"; else echo "- **$2:** not built this time (see the workflow run)"; fi
          }
          v="${GITHUB_REF_NAME#v}"
          {
            # (the release's own notes, without this section if a re-run already added it)
            gh release view "$GITHUB_REF_NAME" -R "$REPO" --json body -q .body | awk '/^## Kindred Spirit Setup \(macOS\)/{exit} {print}'
            echo
            echo "## Kindred Spirit Setup (macOS)"
            echo
            echo "One download that installs her brain, her AI, her models and the mod, step by step. How to open it the first time (macOS asks, because it isn't signed with a paid Apple certificate): [docs/SETUP.md](https://github.com/$REPO/blob/main/docs/SETUP.md)."
            echo
            line "Kindred-Spirit-Setup-$v-macos-arm64.dmg" "Apple silicon (M1 and newer)" "built and tested on GitHub's Apple silicon Mac"
            line "Kindred-Spirit-Setup-$v-macos-x86_64.dmg" "Intel" "built and tested on GitHub's Intel Mac; not yet tried by a person on a real Intel Mac: reports welcome"
            echo "- **Windows and Linux:** not yet ([#40](https://github.com/$REPO/issues/40), [#81](https://github.com/$REPO/issues/81)). Friends on any system can join a host's LAN world with just the mod."
            echo
            echo "Check a download: \`shasum -a 256 -c Kindred-Spirit-Setup-$v-macos-arm64.dmg.sha256\` (in the folder where both are)."
          } > notes.md
          gh release edit "$GITHUB_REF_NAME" -R "$REPO" --notes-file notes.md
