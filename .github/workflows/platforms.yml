name: Platforms
# Does Kindred Spirit install and run on each system, on a clean machine? (#104; how to run the same checks yourself:
# docs/TESTING-PLATFORMS.md). No keys or secrets: a stand-in AI answers her. Not part of "CI passed": it runs only
# when the install, the mod or the brain change, on release tags, and on demand (Actions -> Platforms -> Run).
on:
  pull_request:
    paths:
      - "setup/**"
      - "docker/**"
      - "scripts/**"
      - "services/**"
      - "brain/kindred/**"
      - "brain/tools/**"
      - "brain/requirements*.txt"
      - "mod/src/main/**"
      - "mod/*.gradle"
      - "mod/*.gradle.kts"
      - "mod/versions/**"
      - "mod/gradle.properties"
      - ".github/workflows/platforms.yml"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platforms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  macos:
    name: macOS, ${{ matrix.chip }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, chip: Apple silicon }
          - { runner: macos-15-intel, chip: Intel }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - name: The mod, for the Setup to carry
        run: ./gradlew build -x test --no-daemon --quiet
        working-directory: mod
      - name: Kindred Spirit Setup (build the app with its whisper-server, install it, download her models, test)
        run: mkdir -p dist && KINDRED_KEEP_DMG="$PWD/dist" KINDRED_TEST_MODELS=1 scripts/test-install.sh setup-app
      - name: Her brain with scripts/setup.sh (the terminal install)
        if: success() || failure()
        run: scripts/test-install.sh brain
      - name: Minecraft's side (Fabric, Fabric API, the mod, the launcher profile)
        if: success() || failure()
        run: scripts/test-install.sh minecraft
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() || failure()
        with:
          name: setup-macos-${{ matrix.runner }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 14

  linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - name: Her brain with scripts/setup.sh
        run: scripts/test-install.sh brain
      - name: Minecraft's side (Fabric, Fabric API, the mod, the launcher profile)
        if: success() || failure()
        run: scripts/test-install.sh minecraft
      - name: Kindred Spirit Setup
        if: success() || failure()
        run: scripts/test-install.sh setup-app # says plainly that it's macOS-only so far (#81)

  docker:
    # Her brain in Docker (#128): the image builds, and run as docker/README.md says, a pretend game talks to her
    # through 127.0.0.1. Linux only: GitHub's Windows machines run Windows containers, not Linux ones (Docker
    # Desktop on a Windows PC runs this same Linux image).
    name: Docker image (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: The pretend game's Python
        run: python -m pip install -q -r brain/requirements.txt
      - name: Build the image, run it, talk to her
        run: KINDRED_PYTHON="$(command -v python)" scripts/test-install.sh docker

  windows:
    name: Windows (a friend's PC, and hosting her)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 25
      - name: Update Pip (scripts/update-pip-windows.ps1) into a fresh Minecraft folder
        shell: powershell # Windows PowerShell 5.1, as on a friend's PC
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "appdata"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\update-pip-windows.ps1 -Here
          if ($LASTEXITCODE -ne 0) { throw "update-pip-windows.ps1 failed" }
          $mods = Join-Path $env:APPDATA ".minecraft\mods"
          Get-ChildItem $mods | Format-Table Name, Length
          $kindred = Get-ChildItem $mods -Filter "kindred-spirit-*.jar" | Select-Object -First 1
          if (-not $kindred) { throw "no Kindred jar in $mods" }
          $mc = [regex]::Match($kindred.Name, '\+([0-9.]+)\.jar$').Groups[1].Value  # (a fresh install: the newest Minecraft)
          if (-not (Get-ChildItem $mods -Filter "fabric-api-*+$mc.jar")) { throw "no Fabric API for Minecraft $mc in $mods" }
          Write-Host "ok: the mod and Fabric API are in the mods folder"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Hosting her on Windows (scripts\setup-windows.ps1, start, a pretend game, sleep and wake, stop; #40)
        shell: powershell # Windows PowerShell 5.1, as on a player's PC
        timeout-minutes: 15 # (a hang fails here, not at the job's limit)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test-install-windows.ps1

  client:
    # A real Minecraft client (the dev client: Fabric Loader, Fabric API and the mod) opens a world and says hi; her
    # brain answers through a stand-in AI (#105). Linux runs it on a virtual screen with software OpenGL. macOS is an
    # experiment (GitHub's Macs have no GPU; Apple's software OpenGL may or may not be enough), allowed to fail.
    # Windows runners have no OpenGL 3.2 for Minecraft at all (docs/TESTING-PLATFORMS.md says what could change that).
    name: Minecraft client, ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60 # (one game per Minecraft version in mod/versions/)
    continue-on-error: ${{ matrix.experiment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, name: Linux, experiment: false }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - name: A virtual screen and software OpenGL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb libgl1-mesa-dri libegl1 libegl-mesa0 # (EGL: 26.x)
      - name: The game opens a world, says hi, and she answers
        env:
          KINDRED_TEST_CLEAN_MACHINE: "1" # a fresh runner: nobody's Pip lives here
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: mkdir -p client-check && KINDRED_KEEP_SCREENSHOT="$PWD/client-check" scripts/test-install.sh client
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() || failure()
        with:
          name: client-check-${{ matrix.runner }}
          path: client-check/
          if-no-files-found: ignore
          retention-days: 14

  client-macos:
    # A real Minecraft client (the dev client: Fabric Loader, Fabric API and the mod) opens a world and says hi; her
    # brain answers through a stand-in AI (#105). Linux runs it on a virtual screen with software OpenGL. macOS is an
    # experiment (GitHub's Macs have no GPU; Apple's software OpenGL may or may not be enough), allowed to fail.
    # Windows runners have no OpenGL 3.2 for Minecraft at all (docs/TESTING-PLATFORMS.md says what could change that).
    name: Minecraft client, macOS (experiment)
    # only on release tags and by hand: GitHub's free plan runs few Macs at once, and this one is allowed to fail
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - name: The game opens a world, says hi, and she answers
        env:
          KINDRED_TEST_CLEAN_MACHINE: "1" # a fresh runner: nobody's Pip lives here
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: mkdir -p client-check && KINDRED_KEEP_SCREENSHOT="$PWD/client-check" scripts/test-install.sh client
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success() || failure()
        with:
          name: client-check-macos-15
          path: client-check/
          if-no-files-found: ignore
          retention-days: 14
