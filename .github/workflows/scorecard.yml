# OpenSSF Scorecard: a weekly score of the repository's security practices (branch protection, pinned actions,
# token permissions, dependency updates, code review...). Results go to the Security tab (Code scanning) and to
# the public Scorecard site, which serves the badge in the README. Free for public repositories.
# What each check means: https://github.com/ossf/scorecard/blob/main/docs/checks.md
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # Mondays, 04:17 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the results to the Security tab
      id-token: write # publish the results (and the badge) to the Scorecard site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: results.sarif
