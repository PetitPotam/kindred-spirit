plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Mojang's official names: the same names other loaders and most tutorials use.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
    testLogging { events "failed"; exceptionFormat "full" }
}

loom {
    runs {
        client {
            // Sandbox test script (see DevScript.java): ./gradlew runClient -PdevScript=devscripts/smoke-test.txt
            if (project.hasProperty('devScript')) vmArg "-Dkindredspirit.devScript=${file(project.property('devScript'))}"
            // window size for demo recordings, e.g. -PvideoSize=960x540 (1920x1080 on a Retina screen)
            if (project.hasProperty('videoSize')) {
                def wh = project.property('videoSize').toString().split('x')
                programArgs '--width', wh[0], '--height', wh[1]
            }
        }
        // a second game on the same computer, as a friend joining your LAN world (light mode checks):
        // ./gradlew runGuest -PguestScript=devscripts/lan-guest.txt
        guest {
            client()
            name "Guest client"
            runDir "run-guest"
            programArgs '--username', 'Robin'
            if (project.hasProperty('guestScript')) vmArg "-Dkindredspirit.devScript=${file(project.property('guestScript'))}"
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 21 }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("../LICENSE") { rename { "${it}_${project.archives_base_name}" } }
    from("../NOTICE") { rename { "${it}_${project.archives_base_name}" } } // (the permission to combine it with Minecraft)
}
